<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrance Pass | Astra</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="nav"><a class="brand" href="/">ASTRA<span>+</span></a><nav><a href="/">Home</a><a href="/booking.html">Book</a><a href="/admin.html">Admin</a></nav></header>
<main class="page narrow"><p class="eyebrow">ENTRANCE PASS</p><h1>Buy an entrance pass.</h1><p>PHP 100 per person.</p><form class="panel form" id="entranceForm"><input name="customer_name" placeholder="Full name *" required><input name="email" type="email" placeholder="Email *" required><input name="phone" placeholder="Phone"><input name="booking_date" type="date" required><input name="amount" type="number" value="100" min="100"><label>Proof of payment<input name="proof" type="file"></label><button class="btn primary">Submit request</button><p id="msg"></p></form></main><script>
document.getElementById("entranceForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);f.append("venue","Entrance Pass");f.append("start_time","00:00");f.append("end_time","00:00");const r=await fetch("/api/bookings",{method:"POST",body:f});document.getElementById("msg").textContent=r.ok?"Request submitted. Admin will confirm your payment.":"Something went wrong.";});
</script></body></html>
